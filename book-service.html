<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Service Request | Tech It Easy IT Services LLC</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .form-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        .subtext {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
        }
        textarea {
            min-height: 120px;
        }
        .pay-btn {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4bb543;
            color: white;
            font-weight: bold;
        }
        .pay-btn:hover {
            opacity: .9;
        }
    </style>
</head>
<body>
    <header>
        <h1>TECH IT EASY IT SERVICES LLC</h1>
        <p>Start Your Service Request</p>
    </header>
    <div class="container">
        <div class="form-card">
            <h1>🚀 Start Service Request</h1>
            <p class="subtext">
                Select the service you need and continue securely to payment.
            </p>
            <label for="service">Service Needed</label>
            <select id="service">
                <option value="">Select Service</option>
                <option value="consultation">Personal Tech Consultation ($59)</option>
                <option value="remote">Remote IT Support ($79)</option>
                <option value="optimization">System Optimization ($69)</option>
                <option value="os">OS Installation / Reset ($89)</option>
                <option value="secure">Secure Device Configuration ($79)</option>
                <option value="cloud">Cloud Security Review ($119)</option>
                <option value="business">Business Consulting ($99)</option>
                <option value="cyber">Cybersecurity Assessment ($149)</option>
                <option value="network">Network Design &amp; Setup ($199)</option>
                <option value="website">Website Design &amp; Development (Quote Required)</option>
                <option value="app">Custom Application Development (Quote Required)</option>
            </select>
            <label>Name</label>
            <input type="text" placeholder="Your Name">
            <label>Email</label>
            <input type="email" placeholder="Your Email">
            <label>Phone</label>
            <input type="tel" placeholder="Phone Number">
            <label>Describe Your Issue</label>
            <textarea placeholder="Tell us how we can help..."></textarea>
            <button class="pay-btn" onclick="goToCheckout()"> Pay &amp; Continue </button>
        </div>
    </div>

    <script>
        // Auto-select service from URL parameter
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedService = urlParams.get('service');
            const serviceDropdown = document.getElementById('service');

            if (selectedService && serviceDropdown) {
                serviceDropdown.value = selectedService;
            }
        });

        function goToCheckout() {
            const service = document.getElementById("service").value;
            const links = {
                consultation: "https://buy.stripe.com/dRm5kF5Gd0bucwp58d2Fa0d",
                remote: "https://buy.stripe.com/4gM6oJb0xaQ8aoh4492Fa0m",
                optimization: "https://buy.stripe.com/28EaEZ7Ol0buaoheIN2Fa0l",
                os: "https://buy.stripe.com/5kQ00lfgNgas7c59ot2Fa0k",
                secure: "https://buy.stripe.com/aFafZj0lTbUcdAtcAF2Fa0g",
                cloud: "https://buy.stripe.com/eVq00l7OlcYg2VP1W12Fa0f",
                business: "https://buy.stripe.com/6oUaEZd8Ff6odAteIN2Fa0h",
                cyber: "https://buy.stripe.com/14A14p6KhaQ86817gl2Fa0j",
                network: "https://buy.stripe.com/5kQ28t0lTbUc6811W12Fa0e"
            };
            if (service === "website") {
                window.location = "https://calendly.com/techiteasy";
                return;
            }
            if (service === "app") {
                window.location = "https://calendly.com/techiteasy";
                return;
            }
            if (!service) {
                alert("Please select a service.");
                return;
            }
            window.location = links[service];
        }
    </script>
</body>
</html>
