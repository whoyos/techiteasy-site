<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Case Studies &amp; Portfolio | TECH IT EASY IT SERVICES LLC</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: #111827; padding: 40px 20px; text-align: center; border-bottom: 1px solid #1f2937; }
        nav a { color: #9ca3af; text-decoration: none; margin: 0 12px; font-weight: 600; font-size: 15px; padding-bottom: 4px; }
        nav a.active, nav a:hover { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        .portfolio-container { max-width: 1300px; margin: 40px auto; padding: 0 24px; box-sizing: border-box; }
        .investment-notice-box { background: linear-gradient(135deg, #111c2e, #0f172a); border: 1px solid #1e3a8a; border-radius: 12px; padding: 24px; margin-bottom: 30px; }
        .investment-notice-box h2 { font-size: 20px; color: #ffffff; margin: 0 0 10px 0; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .notice-badges-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
        .notice-tag { background: #0b0f19; border: 1px solid #1f2937; color: #cbd5e1; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; }
        .notice-tag.alert { border-color: #ef4444; color: #f87171; }
        .snapshot-section { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 35px; }
        .snapshot-section h3 { margin: 0 0 15px 0; font-size: 18px; color: #ffffff; font-weight: 800; }
        .snapshot-table-wrapper { overflow-x: auto; }
        .snapshot-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
        .snapshot-table th { background: #1f2937; color: #60a5fa; padding: 10px 14px; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        .snapshot-table td { padding: 12px 14px; border-bottom: 1px solid #1f2937; color: #cbd5e1; }
        .snapshot-table tr:hover td { background: rgba(59, 130, 246, 0.02); color: #ffffff; }
        .stats-strip-banner { background: linear-gradient(135deg, #111827 0%, #0f172a 100%); border: 1px solid #1f2937; padding: 28px; border-radius: 12px; margin-bottom: 35px; }
        .stats-strip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; text-align: center; }
        .stat-item-box h4 { margin: 0; font-size: 22px; color: #3b82f6; font-weight: 900; }
        .stat-item-box p { margin: 4px 0 0 0; font-size: 11px; font-weight: 700; color: #ffffff; text-transform: uppercase; }
        .stat-item-box span { display: block; font-size: 11px; color: #9ca3af; margin-top: 2px; }
        .legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 35px; }
        .legend-card { border-radius: 8px; padding: 12px; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
        .bg-starter { background: rgba(34, 197, 94, 0.05); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .bg-growth { background: rgba(59, 130, 246, 0.05); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .bg-biztech { background: rgba(139, 92, 246, 0.05); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.2); }
        .bg-enterprise { background: rgba(249, 115, 22, 0.05); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.2); }
        .bg-quote { background: rgba(239, 68, 68, 0.05); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .filter-nav { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
        .filter-btn { background: #1e293b; color: #9ca3af; border: 1px solid #334155; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13.5px; transition: all 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: #2563eb; color: #ffffff; border-color: #3b82f6; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .portfolio-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s; }
        .portfolio-card:hover { transform: translateY(-4px); border-color: #3b82f6; }
        .card-img-wrapper { height: 110px; background: #1f2937; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 36px; border-bottom: 1px solid #1f2937; }
        .card-img-wrapper .cat-badge { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); color: #60a5fa; border: 1px solid #3b82f6; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .card-img-wrapper .group-badge { position: absolute; top: 12px; left: 12px; background: rgba(30, 41, 59, 0.9); color: #cbd5e1; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
        .card-body { padding: 24px; flex-grow: 1; display: flex; flex-direction: column; }
        .portfolio-card h3 { font-size: 19px; color: #ffffff; margin: 0 0 12px 0; font-weight: 800; }
        .meta-row { font-size: 13px; color: #9ca3af; margin-bottom: 6px; border-bottom: 1px solid #1f2937; padding-bottom: 6px; display: flex; justify-content: space-between; }
        .meta-row strong { color: #f3f4f6; }
        .card-testimonial-top { background: rgba(30, 41, 59, 0.3); border-bottom: 1px solid #1f2937; padding: 16px 24px; font-style: italic; font-size: 13px; color: #e5e7eb; line-height: 1.4; }
        .card-testimonial-top .stars { color: #ffab00; font-size: 10px; margin-bottom: 4px; font-style: normal; }
        .card-testimonial-top span { display: block; margin-top: 6px; font-weight: 700; color: #34d399; font-style: normal; font-size: 11px; text-transform: uppercase; }
        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
        .split-column h4 { font-size: 12px; color: #60a5fa; text-transform: uppercase; margin: 0 0 6px 0; letter-spacing: 0.05em; font-weight: 700; }
        .block-box { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 6px; margin: 4px 0 12px 0; font-size: 12.5px; }
        .block-box.benchmark-style { border-color: rgba(59, 130, 246, 0.25); }
        .block-box h5 { color: #a78bfa; margin: 0 0 4px 0; font-weight: 700; text-transform: uppercase; }
        .block-box p { margin: 0; color: #9ca3af; }
        .bullets-list { list-style: none; padding: 0; margin: 0; }
        .bullets-list li { font-size: 12.5px; color: #cbd5e1; margin-bottom: 4px; display: flex; align-items: flex-start; gap: 5px; }
        .bullets-list.check-style li i { color: #10b981; margin-top: 2px; }
        .bullets-list.arrow-style li i { color: #3b82f6; margin-top: 2px; }
        .investment-philosophy-section { background: linear-gradient(145deg, #0f172a 0%, #111827 100%); border: 1px solid #1e293b; border-radius: 12px; padding: 32px; margin: 35px 0; }
        .philosophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
        .philosophy-card { background: #0b0f19; border: 1px solid #1f2937; padding: 16px; border-radius: 8px; }
        .philosophy-card i { font-size: 18px; color: #3b82f6; margin-bottom: 8px; }
        .philosophy-card h5 { margin: 0 0 4px 0; font-size: 13px; color: #ffffff; text-transform: uppercase; }
        .philosophy-card p { margin: 0; font-size: 12px; color: #9ca3af; line-height: 1.4; }
        .bottom-disclaimer-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; padding: 24px; margin-top: 35px; }
        .bottom-disclaimer-card h4 { margin-top: 0; font-size: 14px; color: #ffffff; text-transform: uppercase; }
        .bottom-disclaimer-card p { font-size: 13px; color: #9ca3af; line-height: 1.5; margin: 0 0 15px 0; }
        .btn.primary { background: #2563eb; color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 13.5px; display: block; text-align: center; border: none; transition: background 0.2s; }
        .btn.primary:hover { background: #1d4ed8; }
        .cta-section { background: linear-gradient(135deg, #111827 0%, #0f172a 100%); border: 1px solid #1e293b; padding: 35px; border-radius: 12px; text-align: center; margin-top: 35px; }
    </style>
</head>
