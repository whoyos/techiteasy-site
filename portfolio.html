<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Case Studies &amp; Portfolio | TECH IT EASY IT SERVICES LLC</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Base Themes & Premium Dark Typography Reset */
        body { background-color: #0b0f19; color: #f3f4f6; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; margin: 0; padding: 0; }
        header { background: #111827; padding: 50px 20px; text-align: center; border-bottom: 1px solid #1f2937; }
        nav a { color: #9ca3af; text-decoration: none; margin: 0 15px; font-weight: 600; font-size: 15px; transition: color 0.2s; }
        nav a.active, nav a:hover { color: #3b82f6; border-bottom: 2px solid #3b82f6; padding-bottom: 4px; }
        
        .portfolio-container { max-width: 1400px; margin: 50px auto; padding: 0 30px; box-sizing: border-box; }
        
        /* Pre-Qualification & Disclaimer Notice Layout */
        .investment-notice-box { background: linear-gradient(135deg, #111c2e, #0f172a); border: 1px solid #1e3a8a; border-radius: 16px; padding: 30px; margin-bottom: 35px; }
        .investment-notice-box h2 { font-size: 22px; color: #ffffff; margin-top: 0; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .notice-badges-row { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
        .notice-tag { background: #0b0f19; border: 1px solid #1f2937; color: #cbd5e1; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; }
        .notice-tag.alert { border-color: #ef4444; color: #f87171; }

        /* Premium Results, Investment & ROI Overview Table Dashboard */
        .snapshot-section { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; margin-bottom: 45px; }
        .snapshot-section h3 { margin-top: 0; font-size: 20px; color: #ffffff; font-weight: 800; }
        .snapshot-table-wrapper { overflow-x: auto; }
        .snapshot-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .snapshot-table th { background: #1f2937; color: #60a5fa; padding: 12px 16px; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
        .snapshot-table td { padding: 14px 16px; border-bottom: 1px solid #1f2937; color: #cbd5e1; }
        .snapshot-table tr:hover td { background: rgba(59, 130, 246, 0.02); color: #ffffff; }

        /* Color-Coded Portfolio Badges & Legend Grid */
        .legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin: 25px 0 40px 0; }
        .legend-card { border-radius: 10px; padding: 16px; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; gap: 4px; }
        .bg-starter { background: rgba(34, 197, 94, 0.07); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .bg-growth { background: rgba(59, 130, 246, 0.07); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .bg-biztech { background: rgba(139, 92, 246, 0.07); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
        .bg-enterprise { background: rgba(249, 115, 22, 0.07); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
        .bg-quote { background: rgba(239, 68, 68, 0.07); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .legend-card strong { font-size: 14px; font-weight: 800; }

        /* Filter Controls */
        .filter-nav { display: flex; justify-content: center; gap: 12px; margin: 40px 0; flex-wrap: wrap; }
        .filter-btn { background: #1e293b; color: #9ca3af; border: 1px solid #334155; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s ease; }
        .filter-btn.active, .filter-btn:hover { background: #2563eb; color: #ffffff; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

        /* Gallery Grid Layout with Rounded Zoom Custom Cards */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .portfolio-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .portfolio-card:hover { transform: translateY(-6px); border-color: #3b82f6; box-shadow: 0 25px 35px -5px rgba(0,0,0,0.6); }
        
        /* Gallery Image Banner Component with Zoom Trigger */
        .card-img-wrapper { height: 130px; background: #1f2937; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; font-size: 44px; border-bottom: 1px solid #1f2937; transition: all 0.3s; }
        .portfolio-card:hover .card-img-wrapper { background: #1e293b; transform: scale(1.02); }
        .card-img-wrapper .cat-badge { position: absolute; top: 15px; right: 15px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); color: #60a5fa; border: 1px solid #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .card-img-wrapper .group-badge { position: absolute; top: 15px; left: 15px; background: rgba(30, 41, 59, 0.9); color: #cbd5e1; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; }

        .card-body { padding: 28px; flex-grow: 1; display: flex; flex-direction: column; }
        .portfolio-card h3 { font-size: 21px; color: #ffffff; margin: 0 0 5px 0; font-weight: 800; }
        
        /* Metadata Elements Style Layout */
        .meta-row { font-size: 13px; color: #9ca3af; margin-bottom: 6px; border-bottom: 1px solid #1f2937; padding-bottom: 6px; display: flex; justify-content: space-between; }
        .meta-row strong { color: #f3f4f6; }
        .badge-row-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .info-pill { font-size: 11px; font-weight: 700; text-transform: uppercase; background: #1e293b; color: #cbd5e1; padding: 4px 10px; border-radius: 4px; border: 1px solid #334155; }
        .info-pill.highlight { border-color: #3b82f6; color: #60a5fa; }
        
        /* Premium Agency Style Placement Block */
        .card-testimonial-top { background: rgba(30, 41, 59, 0.4); border-bottom: 1px solid #1f2937; padding: 20px 28px; font-style: italic; font-size: 13.5px; color: #e5e7eb; line-height: 1.5; }
        .card-testimonial-top .stars { color: #ffab00; font-size: 11px; margin-bottom: 6px; font-style: normal; }
        .card-testimonial-top span { display: block; margin-top: 8px; font-weight: 700; color: #34d399; font-style: normal; font-size: 11px; text-transform: uppercase; }

        /* Multi-Sentence Instruction Breakdowns Layout Elements */
        .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .split-column h4 { font-size: 13px; color: #60a5fa; text-transform: uppercase; margin: 0 0 8px 0; letter-spacing: 0.05em; font-weight: 700; }
        
        .block-box { background: #0f172a; border: 1px solid #1e293b; padding: 14px; border-radius: 8px; margin: 5px 0 15px 0; font-size: 13px; }
        .block-box.benchmark-style { border-color: rgba(59, 130, 246, 0.35); background: rgba(15, 23, 42, 0.6); }
        .block-box h5 { color: #a78bfa; margin: 0 0 6px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .block-box p { margin: 0; color: #9ca3af; line-height: 1.4; }

        .bullets-list { list-style: none; padding: 0; margin: 0; }
        .bullets-list li { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 6px; line-height: 1.4; }
        .bullets-list li i { margin-top: 3px; font-size: 11px; }
        .bullets-list.check-style li i { color: #10b981; }
        .bullets-list.arrow-style li i { color: #3b82f6; }

        /* Proven Business Results Statistics Banner */
        .stats-strip-banner { background: linear-gradient(135deg, #111827 0%, #0f172a 100%); border: 1px solid #1f2937; padding: 35px; border-radius: 16px; margin: 25px 0 45px 0; }
        .stats-strip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; text-align: center; }
        .stat-item-box h4 { margin: 0; font-size: 24px; color: #3b82f6; font-weight: 900; }
        .stat-item-box p { margin: 5px 0 0 0; font-size: 12px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.03em; }
        .stat-item-box span { display: block; font-size: 11.5px; color: #9ca3af; margin-top: 4px; line-height: 1.4; }

        /* High-End Agency Strategic Value Block Section */
        .investment-philosophy-section { background: linear-gradient(145deg, #0f172a 0%, #111827 100%); border: 1px solid #1e293b; border-radius: 16px; padding: 40px; margin: 40px 0; }
        .philosophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
        .philosophy-card { background: #0b0f19; border: 1px solid #1f2937; padding: 20px; border-radius: 10px; }
        .philosophy-card i { font-size: 20px; color: #3b82f6; margin-bottom: 10px; }
        .philosophy-card h5 { margin: 0 0 6px 0; font-size: 14px; color: #ffffff; font-weight: 800; text-transform: uppercase; }
        .philosophy-card p { margin: 0; font-size: 12.5px; color: #9ca3af; line-height: 1.4; }

        .bottom-disclaimer-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; margin-top: 40px; }
